name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ClosetAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ClosetAI-apk
          path: ClosetAI.apk

      - name: Publish release (direct APK download for your phone)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" ClosetAI.apk \
            --title "Closet AI build ${{ github.run_number }}" \
            --notes "Download ClosetAI.apk on your Android phone and install it." \
            --latest
